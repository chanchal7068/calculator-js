<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
    <table>
        <tr>
            <th colspan="3"><input type="text" id="a" class="in"></th>
            <th><input type="button" value="C" onclick="clr()" class="c"></th>
        </tr>
        <tr>
            <th><input type="button" value="1" onclick="pick(1)" class="one"></th>
            <th><input type="button" value="2" onclick="pick(2)" class="two"></th>
            <th><input type="button" value="3" onclick="pick(3)" class="three"></th>
            <th><input type="button" value="/" onclick="pick('/')" class="div"></th>
        </tr>
        <tr>
            <th><input type="button" value="4" onclick="pick(4)" class="four"></th>
            <th><input type="button" value="5" onclick="pick(5)" class="five"></th>
            <th><input type="button" value="6" onclick="pick(6)" class="six"></th>
            <th><input type="button" value="*" onclick="pick('*')" class="multi"></th>
        </tr>
        <tr>
            <th><input type="button" value="7" onclick="pick(7)" class="seven"></th>
            <th><input type="button" value="8" onclick="pick(8)" class="eight"></th>
            <th><input type="button" value="9" onclick="pick(9)" class="nine"></th>
            <th><input type="button" value="-" onclick="pick('-')" class="sub"></th>
        </tr>
        <tr>
            <th><input type="button" value="." onclick="pick('.')" class="dot"></th>
            <th><input type="button" value="0" onclick="pick(0)" class="zero"></th>
            <th><input type="button" value="=" onclick="solve()" class="equal"></th>
            <th><input type="button" value="+" onclick="pick('+')" class="add"></th>
        </tr>
    </table>
    </div>

    <script>
        function pick(val) {
            document.getElementById("a").value +=val;
        }

        function solve() {
            var x = document.getElementById("a").value;
            var y = eval(x);
            document.getElementById("a").value=y;
        }

        function clr() {
            document.getElementById("a").value = " ";
        }
    </script>
</body>
</html>
